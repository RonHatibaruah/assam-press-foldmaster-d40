      </text>

      <!-- Conveyor Track Baseline -->
      <line x1="80" y1="280" x2="1440" y2="280" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
      <text x="80" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">
