<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="sensorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goodSheetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="badSheetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="800">FIGURE 5: ULTRASONIC SENSING &amp; HIGH-SPEED IN-FLIGHT REJECT GATE</text>
  <text x="30" y="60" fill="#94a3b8" font-size="11">Continuous double-sheet detection (&lt; 12 ms) with pneumatic diversion without line stoppage</text>

  <!-- Conveyor Belt Baseline -->
  <line x1="60" y1="240" x2="900" y2="240" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <text x="70" y="260" fill="#64748b" font-size="10" font-family="monospace">High-Speed Paper Transport Belt (V = 2.4 m/s)</text>

  <!-- STATION 1: ULTRASONIC SENSOR HEADS -->
  <g transform="translate(240, 90)">
    <!-- Top Emitter -->
    <rect x="-30" y="0" width="60" height="50" rx="6" fill="url(#sensorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="28" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">EMITTER</text>
    <text x="0" y="40" fill="#bfdbfe" font-size="8" font-family="monospace" text-anchor="middle">300 kHz</text>

    <!-- Ultrasonic Wave Cones -->
    <path d="M -15 50 L -35 140 L 35 140 L 15 50 Z" fill="#38bdf8" opacity="0.25"/>
    <path d="M -8 50 L -20 140 L 20 140 L 8 50 Z" fill="#38bdf8" opacity="0.45"/>

    <!-- Bottom Receiver -->
    <rect x="-30" y="160" width="60" height="50" rx="6" fill="url(#sensorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="188" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">RECEIVER</text>
    <text x="0" y="200" fill="#bfdbfe" font-size="8" font-family="monospace" text-anchor="middle">Acoustic ADC</text>

    <!-- Sensor Label -->
    <rect x="-70" y="-30" width="140" height="22" rx="4" fill="#1e293b" stroke="#3b82f6"/>
    <text x="0" y="-15" fill="#93c5fd" font-size="9" font-weight="700" text-anchor="middle">Pepperl+Fuchs UDB</text>
  </g>

  <!-- Incoming Double Sheet (Overlap detected) -->
  <g transform="translate(140, 225)">
    <rect x="0" y="0" width="160" height="7" rx="2" fill="url(#badSheetGrad)"/>
    <rect x="15" y="-5" width="160" height="7" rx="2" fill="url(#badSheetGrad)" opacity="0.9"/>
    <text x="80" y="-12" fill="#fca5a5" font-size="9" font-family="monospace" text-anchor="middle" font-weight="700">DOUBLE SHEET OVERLAP</text>
  </g>

  <!-- STATION 2: PNEUMATIC REJECT FLAP -->
  <g transform="translate(500, 200)">
    <!-- Diverter Flap (Actuated Downward) -->
    <line x1="0" y1="38" x2="80" y2="95" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Pneumatic Cylinder Callout -->
    <rect x="40" y="-60" width="80" height="45" rx="5" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="80" y="-38" fill="#fda4af" font-size="9" font-weight="700" text-anchor="middle">Fast Solenoid</text>
    <text x="80" y="-24" fill="#f43f5e" font-size="8" font-family="monospace" text-anchor="middle">&lt; 40 ms Action</text>
    <line x1="80" y1="-15" x2="50" y2="60" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Diverted trajectory arrow -->
    <path d="M 40 50 Q 80 110 130 180" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 2"/>
    
    <!-- Rejected Sheet Falling into Bin -->
    <rect x="90" y="160" width="110" height="8" rx="2" fill="url(#badSheetGrad)" transform="rotate(35 90 160)"/>

    <!-- Reject Collection Bin -->
    <rect x="110" y="240" width="160" height="80" rx="6" fill="#1e1b4b" stroke="#f43f5e" stroke-dasharray="4 2"/>
    <text x="190" y="280" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">Reject Waste Tray</text>
    <text x="190" y="298" fill="#cbd5e1" font-size="9" text-anchor="middle">Non-stop operation</text>
  </g>

  <!-- STATION 3: GOOD SHEETS CONTINUING -->
  <g transform="translate(680, 215)">
    <!-- Path line -->
    <line x1="-30" y1="23" x2="200" y2="23" stroke="#10b981" stroke-width="3"/>
    
    <!-- Good Single Sheet -->
    <rect x="20" y="18" width="130" height="6" rx="2" fill="url(#goodSheetGrad)"/>
    <text x="85" y="10" fill="#6ee7b7" font-size="9" font-family="monospace" text-anchor="middle" font-weight="700">SINGLE SHEET (OK)</text>

    <!-- Folding Roller Nip -->
    <circle cx="180" cy="8" r="16" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="180" cy="38" r="16" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="70" fill="#cbd5e1" font-size="9" text-anchor="middle">Rollers #1</text>
    <text x="180" y="82" fill="#34d399" font-size="8" font-family="monospace" text-anchor="middle">To Fold Plates</text>
  </g>

  <!-- Technical Spec Box at Bottom -->
  <g transform="translate(40, 390)">
    <rect width="880" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="24" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold">KEY TECHNICAL BENCHMARKS:</text>
    <text x="20" y="44" fill="#94a3b8" font-size="10">
      • Acoustic Frequency: 300 kHz | • Sheet Gap Resolution: 0.01 mm | • Air Valve Response: 28 ms | • False Trip Rate: &lt; 0.002% | • Speed: 10,000 sh/hr
    </text>
    <text x="640" y="34" fill="#34d399" font-size="11" font-weight="800">ZERO DOWNTIME ON JAMS</text>
  </g>
</svg>