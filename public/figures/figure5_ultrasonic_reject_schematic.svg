        </text>

        <!-- Lower Waste Chute -->
        <rect x="80" y="180" width="220" height="80" rx="6" fill="#fee2e2" stroke="#ef4444"/>
        <text x="190" y="215" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">
