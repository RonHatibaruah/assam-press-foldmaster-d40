<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', system-ui, sans-serif;">
  <!-- Title -->
  <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="800">FIGURE 8: 50,000-SHEET EMPIRICAL PERFORMANCE TEST BENCHMARKS</text>
  <text x="30" y="60" fill="#94a3b8" font-size="11">Side-by-side comparative stress validation: FoldMaster Assam vs. Legacy Friction-Feed Baselines</text>

  <!-- GRAPH 1: THROUGHPUT SPEED STABILITY (Left Half) -->
  <g transform="translate(40, 90)">
    <rect width="420" height="320" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="12" font-weight="700">Throughput Stability over 8-Hour Shift</text>

    <!-- Y-Axis labels (Speed sh/hr) -->
    <text x="45" y="65" fill="#64748b" font-size="9" text-anchor="end">10,000</text>
    <line x1="50" y1="60" x2="390" y2="60" stroke="#334155" stroke-dasharray="2 2"/>
    
    <text x="45" y="115" fill="#64748b" font-size="9" text-anchor="end">7,500</text>
    <line x1="50" y1="110" x2="390" y2="110" stroke="#334155" stroke-dasharray="2 2"/>

    <text x="45" y="165" fill="#64748b" font-size="9" text-anchor="end">5,000</text>
    <line x1="50" y1="160" x2="390" y2="160" stroke="#334155" stroke-dasharray="2 2"/>

    <text x="45" y="215" fill="#64748b" font-size="9" text-anchor="end">2,500</text>
    <line x1="50" y1="210" x2="390" y2="210" stroke="#334155" stroke-dasharray="2 2"/>

    <text x="45" y="265" fill="#64748b" font-size="9" text-anchor="end">0</text>
    <line x1="50" y1="260" x2="390" y2="260" stroke="#475569" stroke-width="1.5"/>

    <!-- X-Axis Hours -->
    <text x="50" y="278" fill="#64748b" font-size="9">Hr 0</text>
    <text x="135" y="278" fill="#64748b" font-size="9">Hr 2</text>
    <text x="220" y="278" fill="#64748b" font-size="9">Hr 4</text>
    <text x="305" y="278" fill="#64748b" font-size="9">Hr 6</text>
    <text x="380" y="278" fill="#64748b" font-size="9">Hr 8</text>

    <!-- FOLDMASTER LINE (TEAL - Steady ~8,850) -->
    <polyline points="50,82 100,80 150,83 200,81 250,84 300,82 350,80 390,83" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    
    <!-- LEGACY MACHINE LINE (RED - Peaks ~1,800 with frequent 0 jams) -->
    <polyline points="50,225 80,220 90,260 115,260 130,222 170,220 185,260 215,260 230,225 270,222 285,260 310,260 330,228 370,220 390,225" fill="none" stroke="#ef4444" stroke-width="2"/>

    <!-- Legend -->
    <circle cx="65" cy="302" r="4" fill="#2dd4bf"/>
    <text x="75" y="306" fill="#2dd4bf" font-size="9" font-weight="700">FoldMaster: 8,850 sh/hr Avg</text>

    <circle cx="235" cy="302" r="4" fill="#ef4444"/>
    <text x="245" y="306" fill="#f87171" font-size="9">Legacy: 1,620 sh/hr (4 Jams)</text>
  </g>

  <!-- GRAPH 2: CUMULATIVE SPOILAGE & PAPER WASTE (Right Half) -->
  <g transform="translate(500, 90)">
    <rect width="420" height="320" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="12" font-weight="700">Cumulative Paper Spoilage (%) vs Impressions</text>

    <!-- Y-Axis labels (% Spoilage) -->
    <text x="45" y="65" fill="#64748b" font-size="9" text-anchor="end">8.0%</text>
    <line x1="50" y1="60" x2="390" y2="60" stroke="#334155" stroke-dasharray="2 2"/>
    
    <text x="45" y="115" fill="#64748b" font-size="9" text-anchor="end">6.0%</text>
    <line x1="50" y1="110" x2="390" y2="110" stroke="#334155" stroke-dasharray="2 2"/>

    <text x="45" y="165" fill="#64748b" font-size="9" text-anchor="end">4.0%</text>
    <line x1="50" y1="160" x2="390" y2="160" stroke="#334155" stroke-dasharray="2 2"/>

    <text x="45" y="215" fill="#64748b" font-size="9" text-anchor="end">2.0%</text>
    <line x1="50" y1="210" x2="390" y2="210" stroke="#334155" stroke-dasharray="2 2"/>

    <text x="45" y="265" fill="#64748b" font-size="9" text-anchor="end">0%</text>
    <line x1="50" y1="260" x2="390" y2="260" stroke="#475569" stroke-width="1.5"/>

    <!-- X-Axis Sheet Counts -->
    <text x="50" y="278" fill="#64748b" font-size="9">0k</text>
    <text x="135" y="278" fill="#64748b" font-size="9">10k</text>
    <text x="220" y="278" fill="#64748b" font-size="9">25k</text>
    <text x="305" y="278" fill="#64748b" font-size="9">40k</text>
    <text x="375" y="278" fill="#64748b" font-size="9">50k</text>

    <!-- LEGACY SPOILAGE CURVE (RED - Climbs to ~6.4%) -->
    <path d="M 50 260 Q 150 180 250 130 T 390 100" fill="none" stroke="#ef4444" stroke-width="2.5"/>

    <!-- FOLDMASTER SPOILAGE CURVE (TEAL - Flattens at ~0.72%) -->
    <path d="M 50 260 Q 120 248 250 242 T 390 240" fill="none" stroke="#10b981" stroke-width="3"/>

    <!-- Callout badge -->
    <rect x="250" y="195" width="135" height="34" rx="4" fill="#064e3b" stroke="#10b981"/>
    <text x="317" y="212" fill="#a7f3d0" font-size="9" font-weight="700" text-anchor="middle">SAVES 2,840 SHEETS</text>
    <text x="317" y="224" fill="#ecfdf5" font-size="8" text-anchor="middle">Per 50,000 Sheet Run</text>

    <!-- Legend -->
    <circle cx="65" cy="302" r="4" fill="#10b981"/>
    <text x="75" y="306" fill="#34d399" font-size="9" font-weight="700">FoldMaster: 0.72% Spoilage</text>

    <circle cx="235" cy="302" r="4" fill="#ef4444"/>
    <text x="245" y="306" fill="#f87171" font-size="9">Legacy: 6.40% Spoilage</text>
  </g>
</svg>