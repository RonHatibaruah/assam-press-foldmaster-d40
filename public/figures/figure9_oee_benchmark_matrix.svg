<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', system-ui, sans-serif;">
  <!-- Title -->
  <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="800">FIGURE 9: OVERALL EQUIPMENT EFFECTIVENESS (OEE) COMPARISON MATRIX</text>
  <text x="30" y="60" fill="#94a3b8" font-size="11">World-Class manufacturing benchmark breakdown for Assam Government Press operations</text>

  <!-- Left: Bar Chart Comparison -->
  <g transform="translate(40, 95)">
    <rect width="560" height="340" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="30" fill="#f8fafc" font-size="13" font-weight="700">OEE Pillar Benchmark Comparison (%)</text>

    <!-- Legend -->
    <rect x="340" y="18" width="12" height="12" rx="2" fill="#0d9488"/>
    <text x="358" y="28" fill="#5eead4" font-size="10" font-weight="600">FoldMaster Assam</text>
    <rect x="465" y="18" width="12" height="12" rx="2" fill="#ef4444"/>
    <text x="483" y="28" fill="#fca5a5" font-size="10">Legacy Press</text>

    <!-- Grid Lines (0%, 25%, 50%, 75%, 100%) -->
    <line x1="80" y1="65" x2="520" y2="65" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="70" y="68" fill="#64748b" font-size="9" text-anchor="end">100%</text>

    <line x1="80" y1="120" x2="520" y2="120" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="70" y="123" fill="#64748b" font-size="9" text-anchor="end">75%</text>

    <line x1="80" y1="175" x2="520" y2="175" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="70" y="178" fill="#64748b" font-size="9" text-anchor="end">50%</text>

    <line x1="80" y1="230" x2="520" y2="230" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="70" y="233" fill="#64748b" font-size="9" text-anchor="end">25%</text>

    <line x1="80" y1="285" x2="520" y2="285" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="288" fill="#64748b" font-size="9" text-anchor="end">0%</text>

    <!-- BARS: AVAILABILITY -->
    <!-- FoldMaster (94.2% -> h=207) -->
    <rect x="110" y="78" width="36" height="207" rx="3" fill="#0d9488"/>
    <text x="128" y="72" fill="#5eead4" font-size="10" font-weight="700" text-anchor="middle">94.2%</text>
    <!-- Legacy (62.0% -> h=136) -->
    <rect x="150" y="149" width="36" height="136" rx="3" fill="#ef4444"/>
    <text x="168" y="143" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">62.0%</text>
    <text x="148" y="305" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Availability</text>

    <!-- BARS: PERFORMANCE -->
    <!-- FoldMaster (95.1% -> h=209) -->
    <rect x="220" y="76" width="36" height="209" rx="3" fill="#0d9488"/>
    <text x="238" y="70" fill="#5eead4" font-size="10" font-weight="700" text-anchor="middle">95.1%</text>
    <!-- Legacy (48.0% -> h=105) -->
    <rect x="260" y="180" width="36" height="105" rx="3" fill="#ef4444"/>
    <text x="278" y="174" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">48.0%</text>
    <text x="258" y="305" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Performance</text>

    <!-- BARS: QUALITY -->
    <!-- FoldMaster (99.2% -> h=218) -->
    <rect x="330" y="67" width="36" height="218" rx="3" fill="#0d9488"/>
    <text x="348" y="61" fill="#5eead4" font-size="10" font-weight="700" text-anchor="middle">99.2%</text>
    <!-- Legacy (93.5% -> h=205) -->
    <rect x="370" y="80" width="36" height="205" rx="3" fill="#ef4444"/>
    <text x="388" y="74" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">93.5%</text>
    <text x="368" y="305" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Quality</text>

    <!-- BARS: TOTAL OEE -->
    <!-- FoldMaster (88.9% -> h=195) -->
    <rect x="440" y="90" width="38" height="195" rx="4" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
    <text x="459" y="84" fill="#6ee7b7" font-size="11" font-weight="800" text-anchor="middle">88.9%</text>
    <!-- Legacy (27.8% -> h=61) -->
    <rect x="482" y="224" width="38" height="61" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="501" y="218" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">27.8%</text>
    <text x="480" y="305" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">TOTAL OEE</text>
  </g>

  <!-- Right: Scorecard & KPI Highlights -->
  <g transform="translate(630, 95)">
    <!-- OEE Card 1 -->
    <rect width="290" height="95" rx="8" fill="#064e3b" stroke="#059669"/>
    <text x="20" y="26" fill="#6ee7b7" font-size="11" font-weight="700">FOLDMASTER TOTAL OEE</text>
    <text x="20" y="65" fill="#ffffff" font-size="36" font-weight="900" font-family="monospace">88.9%</text>
    <text x="20" y="84" fill="#a7f3d0" font-size="10">Class A World-Class Operational Rating</text>

    <!-- OEE Card 2 -->
    <g transform="translate(0, 110)">
      <rect width="290" height="95" rx="8" fill="#450a0a" stroke="#dc2626"/>
      <text x="20" y="26" fill="#fca5a5" font-size="11" font-weight="700">LEGACY FRICTION PRESS OEE</text>
      <text x="20" y="65" fill="#ffffff" font-size="36" font-weight="900" font-family="monospace">27.8%</text>
      <text x="20" y="84" fill="#fecaca" font-size="10">Crippled by mechanical downtime &amp; jams</text>
    </g>

    <!-- Operational Gain Callouts -->
    <g transform="translate(0, 220)">
      <rect width="290" height="120" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="24" fill="#38bdf8" font-size="11" font-weight="700">KEY QUANTIFIED GAINS:</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="10">• Throughput: &lt;strong style="fill:#34d399">+440% Increase&lt;/strong> (8.8k vs 1.6k)</text>
      <text x="15" y="66" fill="#cbd5e1" font-size="10">• MTBF: &lt;strong style="fill:#34d399">420 Operating Hours&lt;/strong> (vs 18 hrs)</text>
      <text x="15" y="86" fill="#cbd5e1" font-size="10">• Setup Time: &lt;strong style="fill:#34d399">&lt; 45 Seconds&lt;/strong> (vs 45 mins)</text>
      <text x="15" y="106" fill="#cbd5e1" font-size="10">• Spoilage: &lt;strong style="fill:#34d399">&lt; 0.8%&lt;/strong> (saving 2.8k sheets/run)</text>
    </g>
  </g>
</svg>