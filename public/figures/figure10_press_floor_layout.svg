      <line x1="940" y1="22" x2="940" y2="28"/>
      <line x1="1040" y1="22" x2="1040" y2="28"/>
      <line x1="1140" y1="22" x2="1140" y2="28"/>
      <line x1="1240" y1="22" x2="1240" y2="28"/>
      <line x1="1340" y1="22" x2="1340" y2="28"/>
      <line x1="1440" y1="22" x2="1440" y2="28"/>
