<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Origami Folding Shape -->
  <g transform="translate(8, 8)" filter="url(#shadow)">
    <!-- Main Folded Sheet Layer 1 -->
    <path d="M 6 8 L 36 8 L 42 22 L 6 22 Z" fill="#0f766e" opacity="0.8"/>
    <!-- Folded Layer 2 -->
    <path d="M 6 22 L 42 22 L 32 36 L 6 36 Z" fill="url(#favGrad)"/>
    <!-- Folded Signature Flap -->
    <path d="M 6 36 L 32 36 L 24 44 L 6 44 Z" fill="#34d399"/>
    
    <!-- Spine Crease Line -->
    <line x1="6" y1="6" x2="6" y2="46" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Mini Sensor Dot -->
    <circle cx="36" cy="15" r="2.5" fill="#38bdf8"/>
  </g>
</svg>